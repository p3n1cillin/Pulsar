name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/tests --parallel
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

  firmware-builds:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    strategy:
      fail-fast: false
      matrix:
        profile: [default, feature-complete]
    # Actions starts the container without its entrypoint, so the IDF
    # environment is never exported and idf.py is not on PATH. Every step
    # sources export.sh itself; it needs bash, not the default sh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build default profile
        if: matrix.profile == 'default'
        working-directory: firmware/airsoft-scope
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-default build
      - name: Build feature-complete profile
        if: matrix.profile == 'feature-complete'
        working-directory: firmware/airsoft-scope
        run: >-
          . "$IDF_PATH/export.sh" &&
          idf.py -B build-feature-complete
          -D SDKCONFIG=build-feature-complete/sdkconfig
          -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ci.defaults"
          build
